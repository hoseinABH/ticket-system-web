<header class="topbar">
  <a class="brand" routerLink="/flights">✈ Ticket System</a>
  <nav>
    <a routerLink="/flights" routerLinkActive="active">Flights</a>
    @if (auth.isLoggedIn()) {
      <a routerLink="/bookings" routerLinkActive="active">My bookings</a>
    }
  </nav>
  <div class="session">
    @if (auth.isLoggedIn()) {
      <span class="muted">{{ auth.email() }}</span>
      <button class="ghost" (click)="auth.logout()">Log out</button>
    } @else {
      <a class="button" routerLink="/login">Sign in</a>
    }
  </div>
</header>

<main class="container">
  <router-outlet />
</main>
